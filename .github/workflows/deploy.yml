name: Deploy

# Só faz deploy depois que o CI passou no commit de main — nunca em paralelo a ele.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Requer, nos secrets do ambiente "production" no GitHub:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# O CLI da Vercel é pinado aqui em vez de ser devDependency: ele só é usado neste
# workflow e arrasta ~16 vulnerabilidades transitivas para o bun.lock do app.
env:
  VERCEL_CLI: vercel@59.26.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Pull Vercel environment
        run: bunx "$VERCEL_CLI" pull --yes --environment=production
      - name: Build for Vercel
        run: bunx "$VERCEL_CLI" build --prod
      - name: Deploy prebuilt output to Vercel
        run: bunx "$VERCEL_CLI" deploy --prebuilt --prod
