# Aplicação completa em modo demonstração: Postgres + migrations + seed + app, com pagamentos simulados
# (PAYMENTS_SIMULATED=true: PIX confirmado sozinho, créditos e repasses Stripe fictícios). Ver docs/docker.md.
# Uso, a partir da raiz: docker compose -f infra/docker-compose.demo.yaml up --build
# Login: admin@gmail.com / adminBR@123 (painel em /admin)
x-app-build: &app-build
  context: ..
  dockerfile: infra/Dockerfile
  args:
    NEXT_PUBLIC_APP_URL: http://localhost:${APP_PORT:-3000}
    # Chave de teste oficial da Cloudflare Turnstile: sempre passa.
    NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:postgres@db:5432/askedly_demo
  NEXTAUTH_URL: http://localhost:${APP_PORT:-3000}
  NEXTAUTH_SECRET: docker-demo-only-not-a-real-secret
  NEXT_PUBLIC_APP_URL: http://localhost:${APP_PORT:-3000}
  CLOUDFLARE_TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
  PAYMENTS_SIMULATED: "true"
  CRON_SECRET: docker-demo-cron

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: askedly_demo
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askedly_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Roda uma vez: aplica as migrations e, se o banco estiver vazio, popula com o seed.
  setup:
    build:
      <<: *app-build
      target: build
    environment:
      <<: *app-env
      SEED_TOTAL_RANDOM_USERS_TO_CREATED: 60
      SEED_TOTAL_FOLLOWERS_RELATIONS: 300
      SEED_RANDOM_QUESTIONS_TO_CREATE: 200
    command: ["sh", "infra/demo-setup.sh"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      <<: *app-build
    environment:
      <<: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  demo_pgdata:
